/* ---------- global event delegation (attached once) ---------- */
function initListeners(){
  const app = document.getElementById('app');

  app.addEventListener('click', async (e)=>{
    if(state.openRowMenu){
      const menuEl = e.target.closest('.row-action-menu');
      const toggleEl = e.target.closest('[data-act="toggleRowMenu"]');
      if(!menuEl && !toggleEl){ state.openRowMenu = null; }
    }

    const goEl = e.target.closest('[data-go]');
    if(goEl){ state.authError=null; goto(goEl.dataset.go==='login-tab'?'login':'register'); return; }

    const menuToggle = e.target.closest('#menuToggle');
    if(menuToggle){ const d=document.getElementById('mobileDrawer'); if(d) d.style.display = (d.style.display==='none'||!d.style.display)?'block':'none'; return; }
    if(e.target.id==='mobileDrawer'){ e.target.style.display='none'; return; }

    const secEl = e.target.closest('[data-section]');
    if(secEl){ const d=document.getElementById('mobileDrawer'); if(d) d.style.display='none'; setSection(secEl.dataset.section); return; }

    const trashTabEl = e.target.closest('[data-trashtab]');
    if(trashTabEl){ state.trashTab = trashTabEl.dataset.trashtab; render(); return; }

    const bdayEl = e.target.closest('[data-birthday-member]');
    if(bdayEl){ openBirthdayModal(bdayEl.dataset.birthdayMember); return; }

    const bdayTplEl = e.target.closest('[data-bday-template]');
    if(bdayTplEl){ if(state.modal){ state.modal.template = bdayTplEl.dataset.bdayTemplate; } render(); return; }

    if(e.target.tagName==='INPUT' && e.target.type==='date'){
      try{ e.target.showPicker && e.target.showPicker(); }catch(_e){}
    }

    const eyeBtn = e.target.closest('[data-toggle-pw]');
    if(eyeBtn){
      const input = document.getElementById(eyeBtn.dataset.togglePw);
      const icon = document.getElementById(eyeBtn.dataset.togglePw+'-icon');
      if(input){
        const showing = input.type === 'text';
        input.type = showing ? 'password' : 'text';
        if(icon) icon.innerHTML = showing ? EYE_OPEN : EYE_OFF;
      }
      return;
    }

    const prevEl = e.target.closest('[data-preview-member]');
    if(prevEl){
      const mem = DB.members.find(x=>x.id===prevEl.dataset.previewMember);
      if(mem && mem.foto){ state.modal = {type:'imagePreview', src: mem.foto, title: mem.namaLengkap}; render(); }
      return;
    }
    const photoWrapEl = e.target.closest('#photoPreviewWrap');
    if(photoWrapEl){
      if(state.memberDraftForm && state.memberDraftForm.foto){
        state.modal = {type:'imagePreview', src: state.memberDraftForm.foto, title: state.memberDraftForm.namaLengkap||'Pas Foto', returnModal: state.modal};
        render();
      }
      /* No photo yet: the wrap is a <label for="photoInput">, so the browser opens the picker natively. */
      return;
    }

    const actEl = e.target.closest('[data-act]');
    if(actEl){ await handleAction(actEl); return; }
  });

  app.addEventListener('change', (e)=>{
    if(e.target.id==='themeToggle'){
      state.theme = e.target.checked ? 'dark' : 'light';
      saveUiPrefs();
      render(); return;
    }
    if(e.target.id==='bulkEditField'){ state.modal.fieldKey = e.target.value; render(); return; }
    if(e.target.id==='filterStatusAktif'){ state.filterStatusAktif = e.target.value; render(); return; }
    if(e.target.id==='selectAllMembers'){
      const boxes = app.querySelectorAll('.rowCheck');
      if(e.target.checked){ boxes.forEach(b=>state.selectedIds.add(b.dataset.id)); }
      else { state.selectedIds = new Set(); }
      render(); return;
    }
    if(e.target.classList && e.target.classList.contains('rowCheck')){
      const id = e.target.dataset.id;
      if(e.target.checked) state.selectedIds.add(id); else state.selectedIds.delete(id);
      render(); return;
    }
    if(e.target.dataset && e.target.dataset.roleSelect!==undefined){
      const userId = e.target.dataset.id, newRole = e.target.value;
      const us = DB.users.find(x=>x.id===userId);
      const oldRole = us ? us.role : null;
      if(newRole === oldRole) return;
      confirmAction({title:'Ubah Level Akun', message:'Ubah level akun "'+(us?esc(us.namaLengkap):'')+'" menjadi '+roleLabel(newRole)+'?', confirmLabel:'Ya, Ubah', onConfirm: ()=>changeUserRole(userId, newRole)});
      return;
    }
    if(e.target.id && e.target.id.endsWith('LogoInput')){
      const prefix = e.target.id.replace('LogoInput','');
      const file = e.target.files && e.target.files[0];
      if(!file) return;
      resizeImageFilePNG(file, 400).then(dataURL=>
        saveOrg({logo_data_url: dataURL}, 'ubah pengaturan utama', 'Logo aplikasi diunggah', 'Logo diperbarui. Klik "Simpan Pengaturan Utama" untuk menyimpan perubahan lain.')
      ).catch(()=>toast('Gagal memuat logo.'));
      return;
    }
    if(e.target.id==='photoInput'){
      const file = e.target.files && e.target.files[0];
      if(!file) return;
      const formEl = document.getElementById('memberForm');
      if(formEl){ state.memberDraftForm = collectMemberForm(formEl); }
      const reader = new FileReader();
      reader.onload = () => {
        state.modal = {type:'photoCrop', imageDataUrl: reader.result, zoom:1, returnModal: state.modal};
        render();
      };
      reader.onerror = () => toast('Gagal memuat foto.');
      reader.readAsDataURL(file);
      try{ e.target.value = ''; }catch(_e){} /* allow re-picking the same file */
      return;
    }
    if(e.target.id==='restoreFile'){
      const file = e.target.files && e.target.files[0];
      if(file) restoreFromFile(file);
      return;
    }
  });

  app.addEventListener('keydown', (e)=>{
    const lb = e.target.closest && e.target.closest('[data-label-btn]');
    if(lb && (e.key==='Enter' || e.key===' ')){ e.preventDefault(); lb.click(); }
  });

  app.addEventListener('input', (e)=>{
    if(e.target.id && (e.target.id.endsWith('SidebarColor') || e.target.id.endsWith('AuthColor'))){
      const prefix = e.target.id.replace('SidebarColor','').replace('AuthColor','');
      applyMasterPreview(prefix);
      return;
    }
    if(e.target.classList && e.target.classList.contains('uc') && e.target.tagName==='INPUT'){
      const pos = e.target.selectionStart, posEnd = e.target.selectionEnd;
      e.target.value = e.target.value.toUpperCase();
      try{ e.target.setSelectionRange(pos,posEnd); }catch(_e){}
      return;
    }
    if(e.target.id==='cropZoom'){
      if(state.modal){ state.modal.zoom = e.target.value/100; }
      layoutCropImage();
      return;
    }
    if(e.target.id==='fontScaleSlider'){
      state.fontScale = parseInt(e.target.value,10);
      const lbl = document.getElementById('fontScaleLabel');
      if(lbl) lbl.textContent = state.fontScale+'px';
      document.body.style.zoom = state.fontScale/14;
      saveUiPrefs();
      return;
    }
    if(e.target.id==='registerPassword' || e.target.id==='acctNewPassword'){
      const isAcct = e.target.id==='acctNewPassword';
      const s = passwordStrength(e.target.value);
      const bar = document.getElementById(isAcct?'acctPwStrengthBar':'pwStrengthBar'), label = document.getElementById(isAcct?'acctPwStrengthLabel':'pwStrengthLabel');
      if(bar){ bar.style.width = s.pct+'%'; bar.style.background = s.color; }
      if(label){ label.textContent = e.target.value ? ('Kekuatan kata sandi: '+s.label) : 'Minimal 8 karakter, kombinasikan huruf besar, kecil, angka & simbol.'; label.style.color = e.target.value ? s.color : 'var(--muted2)'; }
      return;
    }
    if(e.target.id==='searchMembers'){
      state.filterText = e.target.value;
      const pos = e.target.selectionStart;
      render();
      const el = document.getElementById('searchMembers');
      if(el){ el.focus(); try{ el.setSelectionRange(pos,pos); }catch(_e){} }
    }
  });

  app.addEventListener('submit', async (e)=>{
    e.preventDefault();
    if(e.target.id==='loginForm'){
      const fd = new FormData(e.target);
      const captchaInput = parseInt(fd.get('captcha'),10);
      if(!state.captcha || captchaInput !== state.captcha.answer){
        state.authError = 'Jawaban verifikasi salah. Silakan coba lagi.';
        state.captcha = genCaptcha();
        render();
        return;
      }
      setBusy(true, 'Masuk…');
      try{
        state.authError = null;
        await doLogin(fd.get('email'), fd.get('password'));
        state.section = 'home';
        state.captcha = null;
      }catch(err){
        state.captcha = genCaptcha();
        if(err.needsVerify){
          state.pendingVerifyEmail = err.needsVerify;
          state.authError = null;
          try{ await sb.auth.resend({ type: 'signup', email: err.needsVerify }); }catch(_e){}
          state.route = 'verify';
          toast('Kode verifikasi baru telah dikirim ke email Anda.');
        } else {
          state.authError = errMsg(err);
        }
      }finally{ setBusy(false); }
      render();
      return;
    }
    if(e.target.id==='registerForm'){
      const fd = new FormData(e.target);
      const captchaInput = parseInt(fd.get('captcha'),10);
      if(!state.captcha || captchaInput !== state.captcha.answer){
        state.authError = 'Jawaban verifikasi salah. Silakan coba lagi.';
        state.captcha = genCaptcha();
        render();
        return;
      }
      const payload = {
        namaLengkap: fd.get('namaLengkap')||'', gelarJabatan: fd.get('gelarJabatan')||'',
        statusJabatan: fd.get('statusJabatan')||'', email: fd.get('email')||'',
        waCountry: fd.get('waCountry')||'Indonesia', waNumber: fd.get('waNumber')||'',
        password: fd.get('password')||'',
        confirm: fd.get('confirm')||'', namaBuddhis: fd.get('namaBuddhis')||'',
        secretCode: fd.get('secretCode')||''
      };
      setBusy(true, 'Mendaftarkan akun…');
      try{
        state.authError = null;
        const result = await doRegister(payload);
        state.captcha = null;
        if(result.session){
          await afterSignIn();
          state.section = 'home';
          toast('Akun berhasil dibuat.');
        } else {
          state.pendingVerifyEmail = result.email;
          state.route = 'verify';
          toast('Kode verifikasi telah dikirim ke ' + result.email + '.');
        }
      }catch(err){ state.captcha = genCaptcha(); state.authError = errMsg(err); }
      finally{ setBusy(false); }
      render();
      return;
    }
    if(e.target.id==='verifyForm'){
      const fd = new FormData(e.target);
      setBusy(true, 'Memverifikasi…');
      try{
        state.authError = null;
        const u = await verifyOtp(state.pendingVerifyEmail, fd.get('otp'));
        state.pendingVerifyEmail = null;
        state.section = 'home';
        toast(u.role === 'pending'
          ? 'Akun berhasil diverifikasi. Menunggu penetapan level akun oleh Admin.'
          : 'Akun berhasil diverifikasi — level akun: ' + roleLabel(u.role) + '.');
      }catch(err){ state.authError = errMsg(err); }
      finally{ setBusy(false); }
      render();
      return;
    }
  });
}

/* ---------- init ---------- */
function saveUiPrefs(){
  try{ localStorage.setItem('simpab_ui_prefs', JSON.stringify({theme:state.theme, fontScale:state.fontScale, language:state.language})); }catch(_e){}
}
/* Quietly reload shared data when the tab comes back into view (other pengurus may have made changes) */
async function backgroundRefresh(force){
  if(!sb || !currentUser() || state.modal || busyCount > 0) return;
  if(!force && Date.now() - DB.loadedAt < 60 * 1000) return;
  const ae = document.activeElement;
  if(ae && ['INPUT','TEXTAREA','SELECT'].includes(ae.tagName) && ae.id !== 'themeToggle') return;
  try{
    const me = await refreshMe();
    if(!me || me.active === false){
      await doLogout(); state.authError = 'Akun ini telah dinonaktifkan. Hubungi Admin.'; render(); return;
    }
    await loadAll();
    if(!state.modal) render();
  }catch(e){ console.warn('refresh', e); }
}
async function init(){
  restoreOrgCache();
  try{
    const prefs = JSON.parse(localStorage.getItem('simpab_ui_prefs')||'{}');
    if(prefs.theme) state.theme = prefs.theme;
    if(prefs.fontScale) state.fontScale = prefs.fontScale;
    if(prefs.language) state.language = prefs.language;
  }catch(e){}
  initListeners();
  if(!SB_READY){ state.route = 'setup'; render(); return; }
  state.route = 'loading'; render();
  loadOrg().then(()=>{ if(!currentUser() && state.route !== 'loading') render(); }).catch(()=>{});
  try{
    const { data } = await sb.auth.getSession();
    if(data && data.session){
      try{ await afterSignIn(); state.route = 'shell'; }
      catch(e){ state.authError = errMsg(e); state.route = 'login'; }
    } else {
      state.route = 'login';
    }
  }catch(e){ state.authError = errMsg(e); state.route = 'login'; }
  render();
  sb.auth.onAuthStateChange((event)=>{
    if(event === 'SIGNED_OUT' && DB.me){ const org = DB.orgProfile; DB = emptyDB(); DB.orgProfile = org; state.route = 'login'; state.modal = null; render(); }
  });
  setInterval(autoSaveMemberDraft, AUTO_SAVE_INTERVAL_MS);
  setInterval(()=>backgroundRefresh(false), 5 * 60 * 1000);
  document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState === 'visible') backgroundRefresh(false); });
  window.addEventListener('beforeunload', ()=>{ try{ autoSaveMemberDraft(); }catch(e){} });
}

init();
</script>
